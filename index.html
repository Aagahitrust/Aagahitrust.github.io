<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head><body><title>Journey of Light · Aagahi Trust</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gulzar&family=Rozha+One&family=Mukta:wght@400;500;700;800&display=swap">
<style>
/* One committed night-time world, read right to left. Single theme by design. */
:root{
  color-scheme:dark;
  --night:#0F0822; --night2:#1B0F3A; --dusk:#34195E;
  --paper:#FFF3DC; --paper2:#F7E3BD; --ink:#2A1606; --ink2:#5A3A1E; --maroon:#9B1B4A;
  --gold:#FFC53D; --saffron:#FF9F1C; --ember:#FF6A2B; --magenta:#FF3DA0; --teal:#3FD3C0; --sky:#5CD3F2; --violet:#B58CFF;
  --ivory:#FFF4E0; --soft:#D8CBEF; --dim:#A391CC;
  --ur:"Noto Nastaliq Urdu", "Mukta", serif;
  --cal:"Gulzar", "Noto Nastaliq Urdu", serif;
  --lat:"Mukta", Arial, sans-serif;
  --p:0;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0; background:var(--night); color:var(--ivory); font-family:var(--ur); font-size:18px; line-height:2; overflow:hidden}
*{box-sizing:border-box}
h1,h2,h3{margin:0; font-weight:400}
p{margin:0}
button{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--gold); outline-offset:3px; border-radius:8px}
.lat{font-family:var(--lat); direction:ltr; unicode-bidi:isolate}

.app{height:100%; display:grid; grid-template-rows:auto 1fr auto; position:relative; overflow:hidden; isolation:isolate;
  background:linear-gradient(180deg,var(--night) 0%,var(--night2) 55%,var(--dusk) 100%)}

/* ---------- world layers ---------- */
.world{position:absolute; inset:0; z-index:-1; pointer-events:none; overflow:hidden}
.stars i{position:absolute; width:2px; height:2px; border-radius:50%; background:#fff; animation:tw 4s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}
.moon{position:absolute; top:7%; left:9%; width:86px; height:86px; border-radius:50%; background:radial-gradient(circle at 40% 40%,#FFF7D6,#FFE08A 70%); box-shadow:0 0 60px rgba(255,224,138,.45); overflow:hidden}
.moon::after{content:""; position:absolute; inset:-2px; border-radius:50%; background:var(--night); transform:translateX(calc(-18% - (1 - var(--p)) * 60%)); transition:transform 1.6s ease}
.moon.full::after{transform:translateX(-120%)}
.hills{position:absolute; left:-100%; right:-100%; bottom:96px; height:180px; opacity:.55; transform:translateX(calc(var(--p) * 22%)); transition:transform 1.6s cubic-bezier(.5,0,.3,1)}
.roofs{position:absolute; bottom:96px; left:-200%; width:300%; height:230px; transform:translateX(calc(var(--p) * 52%)); transition:transform 1.6s cubic-bezier(.5,0,.3,1)}
.roofs svg, .hills svg{width:100%; height:100%; display:block}
.roofs .w{fill:#2D1B52; transition:fill .8s}
.roofs .w.on{fill:#FFC53D; filter:drop-shadow(0 0 4px #FF9F1C)}
.ground{position:absolute; left:0; right:0; bottom:0; height:100px; background:linear-gradient(180deg,#140A2C,#0A0518); border-top:2px solid rgba(255,197,61,.18)}
.glowfloor{position:absolute; left:0; right:0; bottom:0; height:60%; background:radial-gradient(70% 90% at 50% 110%, rgba(255,159,28,calc(.05 + var(--p) * .3)), transparent 70%); transition:background 1.2s}

/* walker */
.app[data-ch="open"] .walker{right:8%}
.walker{position:absolute; bottom:4px; right:calc(50% - 42px); width:84px; height:126px; z-index:3; pointer-events:none}
.walker svg{width:100%; height:100%; overflow:visible}
.walker .legA,.walker .legB{transform-box:view-box; transform-origin:55px 104px}
.walker.walking .legA{animation:stepA .36s ease-in-out infinite alternate}
.walker.walking .legB{animation:stepA .36s ease-in-out infinite alternate-reverse}
.walker.walking .body{animation:bob .36s ease-in-out infinite alternate}
@keyframes stepA{from{transform:rotate(-20deg)}to{transform:rotate(20deg)}}
@keyframes bob{to{transform:translateY(-3px)}}
.walker .wflame{transform-box:fill-box; transform-origin:50% 100%; animation:flick 1.1s ease-in-out infinite}
.walker .whalo{animation:breathe 2s ease-in-out infinite; transform-box:fill-box; transform-origin:center}

/* ---------- top bar ---------- */
.bar{display:flex; align-items:center; gap:14px; padding:10px clamp(16px,3.5vw,44px) 0; position:relative; z-index:5}
.brand{display:flex; align-items:center; gap:10px; font-family:var(--cal); font-size:26px; color:var(--gold); line-height:1.6}
.brand small{font-family:var(--ur); font-size:13px; color:var(--soft)}
.bar .where{flex:1; text-align:center; font-size:14px; color:var(--dim)}
.fs{white-space:nowrap; display:inline-flex; align-items:center; gap:8px; border:1.5px solid rgba(255,255,255,.18); background:rgba(255,255,255,.05); border-radius:999px; padding:2px 16px; cursor:pointer; font-size:14px}
.fs:hover{border-color:var(--gold)}
.fs svg{width:16px; height:16px}
.toast{position:absolute; top:58px; left:clamp(16px,3.5vw,44px); max-width:340px; background:#34195E; border:1px solid var(--gold); border-radius:14px; padding:8px 14px; font-size:14px; z-index:20}

/* ---------- stage & chapters ---------- */
.stage{position:relative; overflow:hidden}
.chs{position:absolute; inset:0 0 100px 0}
.ch{position:absolute; inset:0; display:grid; align-content:safe center; grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr); gap:clamp(16px,3vw,48px); align-items:center; padding:6px clamp(16px,3.5vw,44px); overflow-y:auto}
.ch[hidden]{display:none!important}
.ch.solo{grid-template-columns:1fr}
.ch.in{animation:chIn .9s cubic-bezier(.2,.8,.2,1) both}
.ch.out{animation:chOut .55s ease-in both}
@keyframes chIn{from{opacity:0; transform:translateX(-60px)}to{opacity:1; transform:none}}
@keyframes chOut{to{opacity:0; transform:translateX(80px)}}

/* paper scroll text panel */
.scroll{position:relative; background:linear-gradient(180deg,var(--paper),var(--paper2)); color:var(--ink); border-radius:6px; padding:18px 26px 20px; box-shadow:0 20px 50px rgba(0,0,0,.45); display:grid; gap:6px; max-height:100%; overflow-y:auto}
.scroll::before,.scroll::after{content:""; position:absolute; left:-10px; right:-10px; height:16px; border-radius:10px; background:linear-gradient(180deg,#8A5A26,#5A3A1E); box-shadow:0 3px 6px rgba(0,0,0,.35)}
.scroll::before{top:-8px} .scroll::after{bottom:-8px}
.ch.in .scroll{animation:unfurl 1s cubic-bezier(.3,.9,.3,1) both .15s}
@keyframes unfurl{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.eyebrow{font-size:14px; color:var(--maroon); font-weight:700; display:flex; align-items:center; gap:8px}
.eyebrow::before{content:""; width:8px; height:12px; border-radius:50% 50% 50% 50%/60% 60% 40% 40%; background:linear-gradient(var(--gold),var(--ember))}
.scroll h2{font-family:var(--cal); font-size:clamp(28px,3vw,42px); line-height:1.7; color:var(--ink)}
.scroll p{font-size:clamp(15px,1.25vw,18px); line-height:2.05; color:var(--ink2)}
.scroll p b{color:var(--maroon); font-weight:700}
.scroll .detail{border-top:1.5px dashed rgba(90,58,30,.35); padding-top:8px; margin-top:4px; min-height:4.5em}
.scroll .detail h3{font-family:var(--cal); font-size:26px; line-height:1.7; color:var(--maroon)}
.scroll ul{margin:0; padding:0 18px 0 0; display:grid; gap:2px}
.scroll li{font-size:clamp(14px,1.15vw,17px); line-height:2; color:var(--ink2)}
.scroll li::marker{color:var(--maroon)}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chips span{border:1.5px solid rgba(155,27,74,.35); color:var(--maroon); border-radius:999px; padding:0 12px; font-size:14px; line-height:2}
.hint{font-size:14px; color:var(--ink2); opacity:.8}
.note{font-size:13px; color:var(--ink2); opacity:.75}
.btn{display:inline-flex; align-items:center; gap:8px; border:2px solid var(--maroon); background:var(--maroon); color:var(--paper); padding:0 18px; border-radius:999px; cursor:pointer; line-height:2.3; font-size:15px; justify-self:start}
.btn.ghost{background:transparent; color:var(--maroon)}
.prop{display:grid; place-items:center; min-width:0; position:relative; height:100%; max-height:560px}
.prop > svg{width:100%; max-width:560px; height:auto; max-height:100%; overflow:visible}

/* reusable diya */
.diya{--s:1; width:calc(120px*var(--s)); height:calc(120px*var(--s)); display:inline-block; flex:none}
.diya svg{width:100%; height:100%; overflow:visible}
.diya .flame,.diya .halo{transform-box:fill-box; transform-origin:50% 100%; transform:scale(0); opacity:0; transition:transform .6s cubic-bezier(.2,1.6,.4,1), opacity .4s}
.diya .halo{transform-origin:center}
.diya.lit .flame{transform:scale(1); opacity:1; animation:flick 1.3s ease-in-out infinite .6s}
.diya.lit .halo{transform:scale(1); opacity:1; animation:breathe 2.4s ease-in-out infinite .6s}
@keyframes flick{0%,100%{transform:scale(1) rotate(-3deg)}35%{transform:scale(1.06,1.12) rotate(3deg)}70%{transform:scale(.96,1.02) rotate(-1deg)}}
@keyframes breathe{50%{transform:scale(1.12); opacity:.8}}

/* 1 opening: match */
.opening{display:grid; justify-items:center; gap:4px; text-align:center}
.opening .big{--s:1.55}
.opening .saying{font-family:var(--cal); font-size:clamp(34px,4.4vw,64px); line-height:1.8; color:var(--ivory); transition:opacity .8s, text-shadow .8s; opacity:.45}
.opening.lit .saying{opacity:1; text-shadow:0 0 30px rgba(255,159,28,.6)}
.opening h1{font-family:var(--cal); font-size:clamp(26px,2.6vw,38px); color:var(--gold); line-height:1.8; opacity:.5; transition:opacity .8s}
.opening p.sub{color:var(--soft); font-size:16px; opacity:.6; transition:opacity .8s}
.opening.lit h1,.opening.lit p.sub{opacity:1}
.matchrow{display:flex; align-items:center; gap:18px; direction:ltr; margin-top:4px}
.matchbox{position:relative; width:200px; height:64px; border-radius:8px; background:linear-gradient(180deg,#F2C14E,#E0A12B); box-shadow:0 8px 20px rgba(0,0,0,.4); overflow:visible; touch-action:none}
.matchbox .strip{position:absolute; left:10px; right:10px; bottom:6px; height:16px; border-radius:4px; background:repeating-linear-gradient(90deg,#5A2A1A 0 3px,#7A3A22 3px 6px)}
.matchbox .label{position:absolute; top:6px; left:0; right:0; text-align:center; font-family:var(--cal); color:#9B1B4A; font-size:16px; line-height:1.4}
.match{position:absolute; bottom:12px; left:6px; width:92px; height:8px; border-radius:4px; background:#F4E1B8; cursor:grab; touch-action:none; z-index:2}
.match::before{content:""; position:absolute; right:-6px; top:-4px; width:16px; height:16px; border-radius:50%; background:#C0282D}
.match .mflame{position:absolute; right:-6px; top:-30px; width:16px; height:26px; border-radius:50% 50% 50% 50%/60% 60% 40% 40%; background:linear-gradient(0deg,#FF6A2B,#FFC53D 60%,#FFF3C4); opacity:0; transform:scale(0); transform-origin:50% 100%; transition:.3s}
.match.fire .mflame{opacity:1; transform:scale(1); animation:flick .9s infinite}
.match:active{cursor:grabbing}
.strikehint{font-size:15px; color:var(--gold); animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.linkbtn{background:none; border:0; color:var(--soft); text-decoration:underline; cursor:pointer; font-size:14px}

/* arch window */
.arch{position:relative; width:min(100%,430px); aspect-ratio:4/5; border-radius:50% 50% 12px 12px/34% 34% 12px 12px; overflow:hidden; background:linear-gradient(180deg,#FFE8F3,#F3E6FF); border:10px solid #C98A3E; box-shadow:0 0 0 4px #5A3A1E, 0 0 60px rgba(255,159,28,.25)}
.arch svg{position:absolute; inset:4% 3% 0 3%; width:94%; height:96%}
.arch .jaali{position:absolute; inset:0; background:radial-gradient(circle at 50% 50%, transparent 60%, rgba(90,58,30,.0)), repeating-conic-gradient(from 45deg, rgba(201,138,62,.12) 0 25%, transparent 0 50%) 0 0/22px 22px; pointer-events:none; mix-blend-mode:multiply}

/* values: qandeel bunting */
.bunting{position:relative; width:100%; max-width:600px; height:360px}
.bunting svg.rope{position:absolute; inset:0 0 auto 0; width:100%; height:80px}
.qrow{position:absolute; inset:0; display:flex; justify-content:space-between; padding:0 4%}
.q{background:none; border:0; padding:0; cursor:pointer; display:grid; justify-items:center; transform-origin:50% 0; animation:sway 3.6s ease-in-out infinite; margin-top:calc(var(--y) * 1px)}
.q:nth-child(2n){animation-delay:-1.2s} .q:nth-child(3n){animation-delay:-2.1s}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.q .cord{width:2px; height:calc(var(--c) * 1px); background:#C98A3E}
.q svg{width:62px; height:110px; overflow:visible}
.q .body{fill:#3A2466; transition:fill .6s}
.q .glow{opacity:0; transition:opacity .6s}
.q.on .body{fill:var(--qc)}
.q.on .glow{opacity:1}
.q.sel svg{filter:drop-shadow(0 0 14px var(--qc))}
.q small{visibility:hidden; font-size:12px; color:var(--soft); max-width:80px; text-align:center; line-height:1.7}

/* legal: stamped documents */
.docs{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; width:100%; max-width:600px}
.doc{position:relative; background:repeating-linear-gradient(180deg, transparent 0 25px, rgba(90,58,30,.12) 25px 26px), linear-gradient(180deg,#FFFDF6,#F4E8CF); color:var(--ink); border-radius:4px; padding:12px 12px 10px; min-height:148px; text-align:right; border:0; cursor:pointer; box-shadow:0 8px 18px rgba(0,0,0,.35); transform:rotate(var(--r)); transition:transform .3s; display:grid; align-content:start; gap:2px;}
.doc:hover{transform:rotate(0) translateY(-4px)}
.doc b{font-size:15px; line-height:1.9; color:var(--maroon)}
.doc span{font-size:12px; line-height:1.9; color:var(--ink2)}
.doc em{font-style:normal; font-size:12px; color:#B0507A}
.doc .stamp{position:absolute; left:8px; bottom:8px; width:76px; height:76px; border-radius:50%; border:3px double #C0282D; color:#C0282D; display:grid; place-items:center; font-family:var(--cal); font-size:16px; line-height:1.3; transform:rotate(-18deg) scale(2.4); opacity:0; pointer-events:none; text-align:center}
.doc.ok .stamp{animation:thump .45s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes thump{0%{opacity:0; transform:rotate(-18deg) scale(2.4)}60%{opacity:.95; transform:rotate(-18deg) scale(.92)}100%{opacity:.85; transform:rotate(-18deg) scale(1)}}
.meter{height:8px; border-radius:8px; background:rgba(90,58,30,.15); overflow:hidden}
.meter i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--maroon),var(--saffron)); transition:width .5s}

/* structure: fanoos */
.fanoos{position:relative; width:100%; max-width:620px; display:grid; gap:16px; justify-items:center}
.fanoos .hook{width:4px; height:26px; background:#C98A3E; border-radius:2px}
.tier{display:flex; justify-content:center; gap:10px; width:100%; position:relative}
.tier::before{content:""; position:absolute; top:-10px; left:14%; right:14%; border-top:2px solid rgba(201,138,62,.6)}
.tier.one::before{display:none}
.lamp{position:relative; background:none; border:0; cursor:pointer; display:grid; justify-items:center; gap:0; flex:1; max-width:190px; padding-top:10px}
.lamp::before{content:""; position:absolute; top:-10px; width:2px; height:18px; background:rgba(201,138,62,.8)}
.lamp .shade{width:64px; height:40px; border-radius:6px 6px 32px 32px; background:#3A2466; border:2px solid #C98A3E; transition:all .5s; position:relative}
.lamp .shade::after{content:""; position:absolute; left:50%; bottom:-10px; width:10px; height:10px; margin-left:-5px; border-radius:50%; background:#C98A3E}
.lamp.named .shade{background:radial-gradient(circle at 50% 70%,#FFF3C4,#FFC53D 55%,#FF9F1C); box-shadow:0 8px 30px rgba(255,159,28,.6)}
.lamp.vacant{opacity:.6}
.lamp b{font-size:12px; line-height:1.8; margin-top:10px; color:var(--ivory); text-align:center}
.lamp small{font-size:11px; color:var(--gold); line-height:1.6}
.lamp[aria-pressed="true"] .shade{transform:scale(1.15); box-shadow:0 0 0 3px var(--ivory), 0 10px 34px rgba(255,159,28,.7)}
dl.info{display:grid; grid-template-columns:auto 1fr; gap:0 12px; margin:0}
dl.info dt{font-size:13px; color:var(--maroon); font-weight:700}
dl.info dd{margin:0; font-size:15px; line-height:1.95; color:var(--ink2)}

/* board seats */
.council{position:relative; width:100%; max-width:560px; aspect-ratio:2/1.2}
.seat{position:absolute; transform:translate(-50%,-50%); display:grid; justify-items:center; background:none; border:0; padding:0; cursor:pointer}
.seat:hover .diya{transform:scale(1.08)}
.seat .diya{--s:.62}
.seat.woman .flame path, .seat.woman .flame{filter:hue-rotate(-40deg) saturate(1.6)}
.seat.opt{opacity:.45}
.seat .tag{position:absolute; top:-6px; left:50%; margin-left:6px; width:22px; height:22px; border-radius:50%; background:var(--teal); color:#0F0822; font-family:var(--lat); font-weight:800; font-size:13px; display:grid; place-items:center}
.legend{display:flex; flex-wrap:wrap; gap:10px; font-size:14px}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{width:12px; height:12px; border-radius:50%}
.stat{font-family:var(--lat); font-weight:800; color:var(--maroon)}

/* programmes: doors */
.street{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; width:100%; max-width:640px; perspective:900px}
.doorway{background:none; border:0; padding:0; cursor:pointer; display:grid; gap:4px; justify-items:center}
.doorway .sign{font-family:var(--cal); font-size:18px; line-height:1.8; color:var(--dc); text-shadow:0 0 12px var(--dc)}
.frame{position:relative; width:100%; aspect-ratio:3/4; border-radius:50% 50% 4px 4px/30% 30% 4px 4px; overflow:hidden; background:#FFF4E0; border:6px solid #8A5A26; box-shadow:0 0 0 3px #3A2210}
.frame .inside{position:absolute; inset:18% 0 0 0; display:grid; place-items:end center; background:linear-gradient(180deg,#FFF4E0,#F3E6FF)}
.frame .inside svg{width:100%; height:100%}
.leaf{position:absolute; top:0; bottom:0; width:50%; background:linear-gradient(90deg,#6A3E1C,#8A5A26); transition:transform 1s cubic-bezier(.4,0,.2,1); backface-visibility:hidden}
.leaf::after{content:""; position:absolute; inset:14% 18%; border:2px solid rgba(255,197,61,.45); border-radius:40% 40% 4px 4px/20% 20% 4px 4px}
.leaf.l{left:0; transform-origin:0 50%} .leaf.r{right:0; transform-origin:100% 50%}
.leaf .knob{position:absolute; top:52%; width:8px; height:8px; border-radius:50%; background:var(--gold)}
.leaf.l .knob{right:8px} .leaf.r .knob{left:8px}
.doorway[aria-selected="true"] .leaf.l{transform:rotateY(-105deg)}
.doorway[aria-selected="true"] .leaf.r{transform:rotateY(105deg)}
.doorway[aria-selected="true"] .frame{box-shadow:0 0 0 3px #3A2210, 0 0 40px var(--dc)}

/* theory of change: oil */
.oil{position:relative; width:100%; max-width:560px; aspect-ratio:1.2/1}
.oil svg{width:100%; height:100%; overflow:visible}
.jar{cursor:pointer}
.jar .jb{transition:transform .6s cubic-bezier(.4,0,.2,1); transform-box:fill-box; transform-origin:50% 100%}
.jar.poured .jb{transform:rotate(var(--tilt))}
.jar.poured .jbody{opacity:.55}
.stream{stroke-dasharray:400; stroke-dashoffset:400; opacity:0}
.stream.go{animation:pour 1.1s ease-in-out forwards}
@keyframes pour{0%{stroke-dashoffset:400; opacity:1}60%{stroke-dashoffset:0; opacity:1}100%{stroke-dashoffset:-400; opacity:0}}
#oillevel{transition:transform 1s cubic-bezier(.4,0,.2,1); transform-box:fill-box; transform-origin:50% 100%}
.bigflame{transform-box:fill-box; transform-origin:50% 100%; transform:scale(0); transition:transform .8s cubic-bezier(.2,1.6,.4,1)}
.oil.full .bigflame{transform:scale(1); animation:flick 1.3s ease-in-out infinite .8s}
.oil.full .bighalo{opacity:1}
.bighalo{opacity:0; transition:opacity 1s}
.cond{display:grid; grid-template-columns:auto 1fr; gap:8px; align-items:baseline}
.cond b{font-family:var(--cal); color:var(--maroon); font-size:20px}
.cond.done span{color:var(--ink)}
.cond span{color:var(--ink2); font-size:15px; line-height:1.95}
.cond.done b::after{content:" ✓"; font-family:var(--lat); color:#1E8C6E}
.thenline{border-radius:10px; padding:6px 12px; transition:background .8s, color .8s; color:var(--ink2)}
.thenline.on{background:linear-gradient(90deg,rgba(255,159,28,.35),rgba(255,61,160,.25)); color:var(--ink)}

/* partners: kites */
.kites{position:relative; width:100%; max-width:560px; aspect-ratio:1/1}
.kites svg{width:100%; height:100%; overflow:visible}
.kite{cursor:pointer}
.kite .kb{transform-box:fill-box; transform-origin:50% 100%; animation:kfly 4s ease-in-out infinite}
.kite:nth-of-type(2) .kb{animation-delay:-1s} .kite:nth-of-type(3) .kb{animation-delay:-2s} .kite:nth-of-type(4) .kb{animation-delay:-3s}
@keyframes kfly{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(6deg) translateY(-8px)}}
.kite.sel .kd{stroke:#fff; stroke-width:4}
.kite:focus-visible{outline:none}
.kite:focus-visible .kd{stroke:var(--gold); stroke-width:5}

<script type="application/json" id="content">{"ui":{"brand":"آگہی","brandEn":"AAGAHI TRUST","tag":"For women’s health, rights and autonomy","chapter":"Chapter","of":"of","navs":["Begin","About","Vision","Values","Registration","Structure","Board","Programmes","Change","Partners","Safeguarding","Learning","Team","Join us"]},"open":{"saying":"One lamp lights another","q":"Will you light the first diya?","hint":"Strike the match on the box","easy":"or tap here","lit":"The diya is lit! Tap it again to put it out.","go":"Walk on"},"who":{"eb":"Who we are","h":"What is Aagahi?","sub":"Awareness that becomes action","p":"“Aagahi” means awareness. Aagahi is a women-led trust. We work on women’s sexual and reproductive health and rights (SRHR), ending gender-based violence (GBV), supporting women affected by climate change, and building women’s economic and political power: from direct services in communities all the way to policy.","chips":["Direct services","Community mobilisation","Research","Policy advocacy"],"note":"Our systems are built to the standards of UN agencies, donors and international foundations.","pkH":"Our symbol: phulkari","pk":"Phulkari is the embroidery of Pakistani women. Stitch by stitch, plain cloth fills with colour. Aagahi works the same way: small efforts join into big change. That is why phulkari stitches draw themselves on every page."},"vision":{"eb":"Vision & Mission","h":"What kind of Pakistan do we want?","vl":"Our vision","v":"A Pakistan where every woman and girl makes her own decisions about her body, health and life, free from violence, discrimination and barriers to reproductive justice.","ml":"Our mission","m":"We advance women’s sexual and reproductive health and rights in Pakistan, prevent gender-based violence and support survivors, stand with women through climate disasters, and grow their economic and political power. We do this through direct services, community mobilisation, research and policy advocacy, in partnership with government, civil society and international institutions."},"values":{"eb":"Our values","h":"What do we stand for?","hint":"Tap a lantern to light it.","all":"All the lanterns are lit!","items":[["Bodily autonomy","Grounded in CEDAW, the ICPD Programme of Action and the Beijing Platform for Action."],["Survivors first","Do no harm, in every violence and health programme."],["Evidence-led decisions","Every decision guided by data, research and community voice."],["Everyone included","Across class, sect, ethnicity, disability and region, including the most remote districts."],["Transparency & accountability","Answerable to communities, our board and donors alike."],["Local leadership, global standards","Pakistani leadership that meets international benchmarks."]]},"legal":{"eb":"Registration","h":"Can you trust us?","sub":"Here is the proof","p":"Aagahi is an independent, non-profit, non-political organisation registered under the laws of Pakistan.","stamp":"Verified","done":"documents verified","items":[["Registration","Trusts Act, Societies Act 1860, Social Welfare Ordinance 1961 or SECP Section 42",""],["Tax exemption","Income Tax Ordinance 2001, Section 2(36)",""],["PCP certificate","Pakistan Centre for Philanthropy",""],["EAD clearance / NOC","Permission to receive foreign funding",""],["Annual audit","By an SBP-approved audit firm",""],["Donor portals","UN Partner Portal, Candid, DevelopmentAid",""]],"note":"International partners check every document themselves."},"structure":{"eb":"Structure","h":"Who does what?","hint":"Tap any box. Faded boxes are future positions.","repL":"Reports to","roleL":"Role","nodes":{"board":{"t":"Board of Trustees","p":"Fatimah Riaz (Chairperson) · Sidra Fatima · Haya Pir","rep":"Governs the trust","d":"Sets direction and approves budgets and policies. All three founding trustees are women."},"ed":{"t":"Executive Director","p":"Sidra Fatima","rep":"The Board","d":"Leads day-to-day work, programmes, donors and the team."},"adv":{"t":"Advisory Council","p":"Forming soon","rep":"The Board","d":"Advice from health, legal and community experts."},"audit":{"t":"Audit & Safeguarding Committee","p":"Haya Pir · Fatimah Riaz","rep":"The Board","d":"Checks the accounts and runs a safe complaints system. Haya Pir is the safeguarding focal point. Safeer Ali Behleem prepares the finance records."},"aarish":{"t":"Programmes, Finance & Communications","p":"Aarish Maqsood · Safeer Ali Behleem","rep":"Sidra Fatima","d":"Aarish: activity planning, data, reports and social media. Safeer: budget, accounts and admin."},"future":{"t":"Future team","p":"Programme managers · Finance · Field teams","rep":"Sidra Fatima","d":"As funding grows: programme managers, a finance officer and field teams across the country."}}},"board":{"eb":"Governance","h":"Who makes the decisions?","p":"A board of 7 to 9 trustees. At least 60% women, and at least one trustee from the communities we serve.","exL":"Board expertise","ex":"Medicine and public health, law and finance.","seats":"Board seats","hint":"Tap a seat to light or dim its diya.","leg":["Woman trustee","Other trustee","From the community","Optional seat"],"adL":"Advisory Council guidance","ad":"Clinical SRHR standards, Islamic jurisprudence on family health for community acceptance, and rigorous monitoring."},"prog":{"eb":"Programmes","h":"What do we do?","sub":"A programme behind every door","hint":"","items":[{"s":"Health","h":"Health & reproductive rights","li":["Family planning counselling and services through clinics and mobile health units.","Maternal, newborn and adolescent health, with safe-motherhood referrals.","Age-appropriate puberty and reproductive health education, adapted to local context, in schools, madrassahs (where permitted) and communities.","Prevention of HIV and other infections, and menstrual health."]},{"s":"Safety","h":"Preventing violence & supporting survivors","li":["Case management and psychosocial support for survivors.","Links to Dar-ul-Aman shelters and legal aid.","Awareness work with men, boys and religious leaders.","Support to implement laws on violence and harassment."]},{"s":"Livelihoods","h":"Economic & political power","li":["Skills training, microfinance and market access.","Women’s participation in local government and union councils."]},{"s":"Climate","h":"Climate change & women","li":["Getting essential health and menstrual supplies to women and girls during floods, extreme heat and other disasters.","Care for pregnant women and new mothers during and after disasters.","Disasters raise the risk of violence, displacement and child marriage for women and girls; we work to protect them.","Climate-resilient livelihood training, and bringing women’s voices into climate policy."]},{"s":"Research","h":"Research & policy","li":["Programme research and evaluation, shared with technical working groups.","Policy advocacy aligned with SDG 3 (health), SDG 5 (gender equality), CEDAW and ICPD25 commitments.","Representation in provincial and federal SRHR and GBV working groups and donor forums."]}]},"toc":{"eb":"Theory of change","h":"How does change happen?","hint":"Tap each jar to pour oil into the diya.","conds":[["If","women can easily access health services"],["and","attitudes in society change"],["and","survivors of violence find protection and justice"],["and","women have their own income"],["and","women’s health and safety are protected in climate disasters too"]],"thenW":"then","then":"women will make their own decisions about their health, safety and lives.","careH":"And our work must never backfire","careHint":"When the wind blows, the flame flickers. Add the glass to protect it.","glass":"Add the glass","glassOff":"Remove the glass","care":["Assess risks before any work begins","Consult communities, families and religious leaders","Women’s safety and privacy come first","Change course at once if we see harm"],"reset":"Reset","chips":["SDG 3 · Health","SDG 5 · Gender equality","CEDAW","ICPD"]},"par t!","items":[["Fatimah Riaz","Chairperson","Trustee · Chair of the board","Leads the board, approves strategy and budget, and represents the trust."],["Sidra Fatima","Executive Director","Trustee · Head of the trust","Leads day-to-day work, programmes, donors and the team."],["Haya Pir","General Secretary","Trustee · Safeguarding","Records, registration and legal work, and the safeguarding focal point."],["Safeer Ali Behleem","Finance & Admin","Finance","Budget, accounts, bank records and audit preparation. Reports to the Executive Director."],["Aarish Maqsood","Programmes & Communications","Programmes","Planning, data, reports and social media."]]},"join":{"eb":"Join us","h":"Will you light the next diya?","p":"Partners, donors and volunteers carry this light to every district. Tap the sky to release a lantern.","contactL":"Contact","email":"aagahi.khi@gmail.com","phone":"+92 339 0003825","office":"Habib University, Block 18, Gulistan-e-Jauhar, University Avenue, Off Shahrah-e-Faisal, Karachi","restart":"Start again","cap":"Tap the sky","lan":"lanterns"},"layout":{"ui.logo":{"x":0,"y":0,"s":0.7},"who.prop":{"x":0,"y":0,"s":0.8},"open.copy":{"x":-7,"y":41,"s":1},"open.art":{"x":-11,"y":39,"s":1},"vision.scroll":{"x":-4,"y":-51,"s":0.9},"vision.prop":{"x":0,"y":-36,"s":0.7},"structure.prop":{"x":-2,"y":10,"s":0.9},"toc.prop":{"x":-6,"y":-24,"s":0.9},"toc.scroll":{"x":-2,"y":-54,"s":0.8}}}</script>

const diya=(cls="")=>`<span class="diya ${cls}">${DSVG}</span>`;
let editing=false;
// phulkari: satin-stitched rhombi that stitch themselves in
const PK={gold:"#FFC53D",saffron:"#FF9F1C",magenta:"#FF3DA0",rose:"#FF7AB8",teal:"#3FD3C0",sky:"#5CD3F2",violet:"#B58CFF",ivory:"#FFF1D6"};
function st(x1,y1,x2,y2,col,w,d){const l=Math.hypot(x2-x1,y2-y1).toFixed(1); return `<line class="st" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${col}" stroke-width="${w}" style="--l:${l};--d:${d.toFixed(2)}s"/>`;}
function rhomb(cx,cy,w,h,rot,col,t0,step,pre=""){let s=`<g transform="translate(${cx} ${cy}) rotate(${rot})${pre}">`; let k=0; for(let y=-h+2.1;y<h;y+=4.2){const half=w*(1-Math.abs(y)/h); if(half<1.2) continue; s+=st(-half,y,half,y,col,3.1,t0+k*step); k++;} return s+"</g>";}
function pstar(r,cols,t0=0){let s=""; for(let i=0;i<8;i++) s+=rhomb(0,0,r*.26,r*.5,i*45,cols[i%cols.length],t0+i*.07,.01,` translate(0 ${-r*.52})`); s+=rhomb(0,0,r*.16,r*.16,45,PK.ivory,t0+.6,.02); return s;}
function medallion(r,cols,ring){let s=pstar(r,cols); const n=ring||16; for(let i=0;i<n;i++){const a=i*2*Math.PI/n; s+=rhomb(Math.cos(a)*r*1.25,Math.sin(a)*r*1.25,r*.06,r*.11,i*360/n+90,i%2?PK.teal:PK.gold,.8+i*.03,.02);} return s;}
const MOTIF_COLS=[[PK.gold,PK.magenta],[PK.rose,PK.saffron],[PK.teal,PK.sky],[PK.magenta,PK.violet],[PK.gold,PK.teal],[PK.saffron,PK.rose]];
function band(){let s=""; for(let i=0;i<14;i++) s+=rhomb(20+i*40,11,9,9,45,i%2?PK.magenta:PK.saffron,i*.05,.03); return `<svg viewBox="0 0 560 22" preserveAspectRatio="xMidYMid meet" aria-hidden="true">${s}</svg>`;}

// content helpers: E() renders an editable piece of text; M() a read-only mirror of the same text
function get(p){return p.split(".").reduce((o,k)=>o==null?o:o[k],K)}
function set(p,v){const ks=p.split("."); let o=K; for(let i=0;i<ks.length-1;i++) o=o[ks[i]]; o[ks[ks.length-1]]=v;}

const M=(p,tag="span",cls="")=>`<${tag} class="${cls}" data-m="${p}">${esc(get(p)??"")}</${tag}>`;

(function(){let x=0, s=`<svg viewBox="0 0 3000 230" preserveAspectRatio="none">`;
  while(x<3000){const w=70+Math.random()*120, h=60+Math.random()*150, y=230-h; const c=["#1E1140","#231347","#1A0E38"][Math.floor(Math.random()*3)];
    s+=`<rect x="${x.toFixed(0)}" y="${y.toFixed(0)}" width="${w.toFixed(0)}" height="${h.toFixed(0)}" fill="${c}"/>`;
    const r=Math.random(); if(r<.18){s+=`<path d="M${(x+w*.3).toFixed(0)} ${y} a${(w*.2).toFixed(0)} ${(w*.2).toFixed(0)} 0 0 1 ${(w*.4).toFixed(0)} 0Z" fill="${c}"/>`} else if(r<.4){s+=`<rect x="${(x+w*.6).toFixed(0)}" y="${(y-18).toFixed(0)}" width="22" height="18" rx="3" fill="${c}"/>`}
    for(let yy=y+14; yy<218; yy+=24) for(let xx=x+10; xx<x+w-14; xx+=22){ if(Math.random()<.55) s+=`<rect class="w" data-t="${Math.random().toFixed(3)}" x="${xx.toFixed(0)}" y="${yy.toFixed(0)}" width="9" height="12" rx="4"/>`; }
    x+=w+2+Math.random()*10;}
  $("#roofs").innerHTML=s+"</svg>";})();

const toast=$("#toast"); const say=(t,ms=6000)=>{toast.textContent=t; toast.hidden=false; clearTimeout(say.t); say.t=setTimeout(()=>toast.hidden=true,ms)};
const FSMSG="Your browser blocked full screen here. Press F11 on Windows, or Ctrl + Cmd + F on a Mac.";
$("#fs").addEventListener("click",()=>{const d=document, el=d.documentElement;
  if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d); return;}
  const req=el.requestFullscreen||el.webkitRequestFullscreen; if(!req){say(FSMSG); return;}
  try{const p=req.call(el); if(p&&p.catch) p.catch(()=>say(FSMSG));}catch(e){say(FSMSG)}});
document.addEventListener("fullscreenchange",()=>{$("#fs").classList.toggle("on",!!document.fullscreenElement);});
let autoFs=false; document.addEventListener("pointerdown",()=>{ if(autoFs||editing) return; autoFs=true; const el=document.documentElement, d=document; if(d.fullscreenElement) return; const req=el.requestFullscreen||el.webkitRequestFullscreen; if(req){ try{const p=req.call(el); if(p&&p.catch) p.catch(()=>{});}catch(e){} } },true);

  kites.forEach((k,i)=>{k.addEventListener("click",()=>pick(i)); k.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault(); pick(i);}});}); pick(S.kite);
 },
 safe(sec){

  const nearest=()=>((Math.round(-S.rot/90)%4)+4)%4;
  const setStep=i=>{S.rot=-i*90+Math.round((S.rot+i*90)/360)*360; wheel.style.transform=`rotate(${S.rot}deg)`; show(i);};

  $$(".stepdot",sec).forEach(g=>{g.addEventListener("click",e=>{e.stopPropagation(); stopAuto(); setStep(+g.dataset.i)}); g.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault(); stopAuto(); setStep(+g.dataset.i)}});});
  let wd=null;
  svg.addEventListener("pointerdown",e=>{ if(e.target.closest(".stepdot")) return; stopAuto(); const r=svg.getBoundingClientRect(); const cx=r.left+r.width*.5, cy=r.top+r.height*(270/560); wd={cx,cy,a:Math.atan2(e.clientY-cy,e.clientX-cx),r0:S.rot}; wheel.classList.add("drag"); svg.setPointerCapture(e.pointerId);});
  svg.addEventListener("pointermove",e=>{ if(!wd) return; const a=Math.atan2(e.clientY-wd.cy,e.clientX-wd.cx); S.rot=wd.r0+(a-wd.a)*180/Math.PI; wheel.style.transform=`rotate(${S.rot}deg)`; if(nearest()!==S.step) show(nearest());});
  svg.addEventListener("pointerup",()=>{ if(!wd) return; wd=null; wheel.classList.remove("drag"); S.rot=Math.round(S.rot/90)*90; wheel.style.transform=`rotate(${S.rot}deg)`; show(nearest());});

 },
 team(sec){

    det.innerHTML=`<h3>${E(p+".0")} · ${E(p+".1")}</h3>${E(p+".2","p","hint")}${E(p+".3","p")}`+(S.team.size===5?E("team.all","p","hint"):"");};

 join(sec){

function fireworks(sec){ if(reduce) return; const f=$("#fireworks",sec); const cols=["#FFC53D","#FF3DA0","#5CD3F2","#3FD3C0","#FF9F1C"];
  for(let b=0;b<4;b++){const cx=15+Math.random()*70, cy=30+Math.random()*40; for(let k=0;k<18;k++){const d=document.createElement("i"); d.className="fw"; const a=k/18*Math.PI*2, r=50+Math.random()*40; d.style.left=cx+"%"; d.style.top=cy+"%"; d.style.background=cols[(k+b)%5]; d.style.setProperty("--dx",(Math.cos(a)*r)+"px"); d.style.setProperty("--dy",(Math.sin(a)*r)+"px"); d.style.animationDelay=(b*.35)+"s"; f.appendChild(d); setTimeout(()=>d.remove(),2600);}}}
let auto=null; function startAuto(){stopAuto(); if(!reduce) auto=setInterval(()=>wire.merlTick&&wire.merlTick(),3400);} function stopAuto(){ if(auto){clearInterval(auto); auto=null;} }

// ---------- journey engine ----------
const track=$("#track"), app=$("#app"), walker=$("#walker"), moon=$("#moon");
ORDER.forEach((k,i)=>{const b=document.createElement("button"); b.className="navlamp"; b.type="button"; b.innerHTML=diya("")+M(`ui.navs.${i}`,"span","lbl"); b.setAttribute("aria-label",get(`ui.navs.${i}`)); b.addEventListener("click",()=>go(i)); track.appendChild(b);});
const navs=$$(".navlamp");
const visited=new Set();
function markLit(i){visited.add(i); navs[i].querySelector(".diya").classList.add("lit");}
let cur=0, busy=false;
function paint(){ const p=cur/(secs.length-1); app.style.setProperty("--p",p.toFixed(3)); moon.classList.toggle("full",cur===secs.length-1); lightCity(Math.max(p,visited.size/secs.length));
  navs.forEach((b,j)=>{ if(j===cur) b.setAttribute("aria-current","step"); else b.removeAttribute("aria-current");});
  $("#prev").disabled=cur===0; $("#next").disabled=cur===secs.length-1; $("#where").textContent=`${get("ui.chapter")} ${UR(cur+1)} ${get("ui.of")} ${UR(secs.length)} · ${get(`ui.navs.${cur}`)}`;
  navs[cur].scrollIntoView({block:"nearest",inline:"center",behavior:reduce?"auto":"smooth"});}
function onEnter(k){ if(k==="board"&&wire.boardEnter) wire.boardEnter(); if(k==="safe"&&wire.safeEnter) wire.safeEnter(); if(k==="merl") startAuto(); else stopAuto(); }
function go(n){ if(n===cur||n<0||n>=secs.length||busy) return; busy=true;
  const out=secs[cur], inn=secs[n]; cur=n; paint();
  const done=()=>{out.hidden=true; out.classList.remove("out"); inn.hidden=false; inn.scrollTop=0; inn.classList.remove("in"); void inn.offsetWidth; inn.classList.add("in"); markLit(n); onEnter(ORDER[n]); walker.classList.remove("walking"); busy=false;};
  if(reduce){done(); return;} const wp=$("#wipe"); wp.classList.remove("go"); void wp.getBoundingClientRect(); wp.classList.add("go"); walker.classList.add("walking"); out.classList.add("out"); setTimeout(done,1100);}
$("#prev").addEventListener("click",()=>go(cur-1)); $("#next").addEventListener("click",()=>go(cur+1));
addEventListener("keydown",e=>{const t=e.target; if(t.isContentEditable||(t.closest&&(t.closest("[role=tab]")||t.closest("#skybox")||t.closest("#match")))) return;
  if(e.key==="ArrowRight"||e.key==="PageDown") go(cur+1); if(e.key==="ArrowLeft"||e.key==="PageUp") go(cur-1);});
let tx=null; const stage=$("#stage");
stage.addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});
stage.addEventListener("touchend",e=>{ if(tx===null||editing) return; const dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>70 && !e.target.closest("#skybox,#charkha,#matchbox")) go(cur+(dx<0?1:-1)); tx=null;});

function renderAll(){ ORDER.forEach((_,i)=>renderCh(i)); paintStatic(); $$(".navlamp .lbl").forEach((el,i)=>el.textContent=get(`ui.navs.${i}`)); visited.forEach(i=>navs[i].querySelector(".diya").classList.add("lit")); paint(); }
renderAll(); applyLayout($(".bar"));
secs[0].classList.add("in");

// ---------- edit mode (only for people who can edit this artifact) ----------
let snapshot=null;
document.addEventListener("input",e=>{ const el=e.target.closest&&e.target.closest("[data-k]"); if(!el||!editing) return; set(el.dataset.k, el.textContent);
  $$(`[data-m="${el.dataset.k}"]`).forEach(m=>m.textContent=el.textContent); });
document.addEventListener("paste",e=>{ if(!editing||!e.target.closest||!e.target.closest("[data-k]")) return; e.preventDefault(); const t=(e.clipboardData||window.clipboardData).getData("text"); document.execCommand("insertText",false,t.replace(/\s*\n\s*/g," ")); });
document.addEventListener("keydown",e=>{ if(editing&&e.key==="Enter"&&e.target.isContentEditable){ e.preventDefault(); e.target.blur(); } },true);
function addHandles(root){ $$("[data-mv]",root).forEach(el=>{ if(el.querySelector(":scope > .mvh")) return; const h=document.createElement("div"); h.className="mvh"; h.innerHTML='<button type="button" class="mvd" title="Move">✥</button><button type="button" class="mvp" title="Bigger">＋</button><button type="button" class="mvm" title="Smaller">－</button>'; el.appendChild(h);
  const key=el.dataset.mv; const L=()=>{K.layout=K.layout||{}; return K.layout[key]||(K.layout[key]={x:0,y:0,s:1});};
  h.querySelector(".mvp").addEventListener("click",e=>{e.stopPropagation(); const l=L(); l.s=Math.min(1.8,+(l.s+.1).toFixed(2)); applyLayout(el.parentElement||root);});
  h.querySelector(".mvm").addEventListener("click",e=>{e.stopPropagation(); const l=L(); l.s=Math.max(.5,+(l.s-.1).toFixed(2)); applyLayout(el.parentElement||root);});
  const d=h.querySelector(".mvd"); let st=null;
  d.addEventListener("pointerdown",e=>{e.preventDefault(); e.stopPropagation(); const l=L(); st={x:e.clientX,y:e.clientY,x0:l.x,y0:l.y}; d.setPointerCapture(e.pointerId);});
  d.addEventListener("pointermove",e=>{ if(!st) return; const l=L(); l.x=Math.round(st.x0+e.clientX-st.x); l.y=Math.round(st.y0+e.clientY-st.y); el.style.setProperty("--mx",l.x+"px"); el.style.setProperty("--my",l.y+"px");});
  d.addEventListener("pointerup",()=>{st=null;}); }); }
function setEditing(on){ editing=on; if(on){ secs.forEach(addHandles); addHandles($(".bar")); } else $$(".mvh").forEach(h=>h.remove()); document.body.classList.toggle("editing",on); $("#editbar").hidden=!on; $("#editbtn").hidden=on;
  $$("[data-k]").forEach(el=>{ if(on) el.setAttribute("contenteditable",'plaintext-only'); else el.removeAttribute("contenteditable"); });
  if(on) say("Edit mode is on. Press Save when you are done.",4000); }
$("#editbtn").addEventListener("click",()=>{ snapshot=JSON.stringify(K); setEditing(true); });
$("#layoutreset").addEventListener("click",()=>{ K.layout={}; secs.forEach(s=>applyLayout(s)); applyLayout($(".bar")); });

function b64dec(b){ const bin=atob(b.trim()); return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0))); }
function buildDoc(){ const b64=$("#shell").textContent.trim(); let tpl=b64dec(b64); $$(".mvh").forEach(h=>h.remove());
  const json=JSON.stringify(K).replace(/</g,"\\u003c");
  tpl=tpl.split("__CON"+"TENT__").join(json).split("__SH"+"ELL__").join(b64);
  return '<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head><body>'+tpl+'</body></html>'; }
let ART_NS=null;
function dl(){ const html=buildDoc(); setEditing(false); try{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([html],{type:"text/html"})); a.download="Aagahi_Roshni_ka_Safar.html"; document.body.appendChild(a); a.click(); a.remove(); say("A file with your changes has been downloaded.",7000);}catch(e){ say("Download failed."); } }
$("#savebtn").addEventListener("click",async()=>{
  if(!ART_NS){ dl(); return; }
  const btn=$("#savebtn"); btn.disabled=true; btn.textContent="Saving…";
  try{ await ART_NS.publish(buildDoc()); say("Saved. Everyone who opens the page will now see your changes."); setEditing(false); }
  catch(err){ const c=err&&err.code;
    if(c==="not_writer"||c==="not_granted"||c==="consent_required"||c==="capability_disabled"){ say("You do not have permission to edit this page."); setEditing(false); $("#editbtn").hidden=true; }
    else if(c==="conflict"){ say("Someone else just saved a change, so the page is reloading the newest version. Please make your change again.",9000); }
    else if(c==="rate_limited"){ say("Saving too often. Wait a minute and try again."); }
    else if(c==="too_large"){ say("The page is too large. Shorten some text and save again."); }
    else { say("Could not save right now. Please try Save again shortly."); }
  } finally { btn.disabled=false; btn.textContent="Save"; }
});
(async()=>{ try{ if(!window.claude||!claude.use) return; const [art,user]=await Promise.all([claude.use("artifact"),claude.use("user")]); ART_NS=art; if(!art) return;
  let can=true; if(user&&user.canEdit){ try{ can=await user.canEdit(); }catch(e){ can=false; } } if(can) $("#editbtn").hidden=false; }catch(e){} })();
})();
